services:
  javadev:
    image: mcr.microsoft.com/devcontainers/java:dev-25-jdk-trixie
    volumes:
      - ..:/workspaces/wg-mgr-spring:cached
    environment:
        - POSTGRES_PASSWORD
        - POSTGRES_USER
        - WGMGR_DB_CONN_STR=postgresql://db:5432/vpn
    command: sleep infinity

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../initdb.d:/docker-entrypoint-initdb.d
    environment:
        - POSTGRES_PASSWORD
        - POSTGRES_USER
        - POSTGRES_DB=vpn
        - PGDATA=/var/lib/postgresql/data

  db-adminer:
    image: adminer
    ports:
      - 8080:8080

volumes:
  pg-data:
